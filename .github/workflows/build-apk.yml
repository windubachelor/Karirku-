name: Build & Release KarirKu APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag rilis opsional (contoh: v1.0.1). Kosongkan untuk otomatis."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure preinstalled Android SDK & accept licenses
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "ERROR: sdkmanager not found under ${SDK_ROOT}"
            exit 1
          fi

          echo "$(dirname "${SDKMANAGER}")" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "Using preinstalled sdkmanager: ${SDKMANAGER}"

          set +o pipefail
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null 2>&1 || true
          set -o pipefail

          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" "platform-tools" "platforms;android-36.1" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Debug & Release Keystores
        id: keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # 1. Restore debug.keystore from debug.keystore.base64 (matches Firebase SHA-1)
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

          # 2. Prepare release keystore: use GitHub Secrets if configured, else auto-generate
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "${SECRET_KEYSTORE_B64}" ] && [ -n "${SECRET_STORE_PASS}" ] && [ -n "${SECRET_KEY_PASS}" ]; then
            printf '%s' "${SECRET_KEYSTORE_B64}" | tr -d '\r\n ' | base64 -d > "${KEYSTORE_FILE}"
            RELEASE_STORE_PASS="${SECRET_STORE_PASS}"
            RELEASE_KEY_PASS="${SECRET_KEY_PASS}"
            echo "mode=secret" >> "$GITHUB_OUTPUT"
            echo "Using persistent release keystore from GitHub Secrets"
          else
            AUTO_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::${AUTO_PASS}"
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -storetype PKCS12 \
              -storepass "${AUTO_PASS}" \
              -keypass "${AUTO_PASS}" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=KarirKu, OU=Mobile, O=KarirKu, L=Jakarta, S=DKI Jakarta, C=ID"
            RELEASE_STORE_PASS="${AUTO_PASS}"
            RELEASE_KEY_PASS="${AUTO_PASS}"
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "Auto-generated release keystore on GitHub Actions"
          fi

          # Export environment variables expected by app/build.gradle.kts signingConfigs.release
          {
            echo "KEYSTORE_PATH=${KEYSTORE_FILE}"
            echo "STORE_PASSWORD=${RELEASE_STORE_PASS}"
            echo "KEY_PASSWORD=${RELEASE_KEY_PASS}"
          } >> "$GITHUB_ENV"

          # Extract SHA-1 fingerprint for release summary
          RELEASE_SHA1="$(keytool -list -v -keystore "${KEYSTORE_FILE}" -alias upload -storepass "${RELEASE_STORE_PASS}" 2>/dev/null \
            | awk '/SHA1:/ {print $2; exit}' || true)"
          echo "release_sha1=${RELEASE_SHA1:-N/A}" >> "$GITHUB_OUTPUT"

      - name: Prepare google-services.json
        id: google_services
        env:
          SECRET_GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          SECRET_GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          GS_PATH="app/google-services.json"

          if [ -f "${GS_PATH}" ]; then
            echo "mode=repo" >> "$GITHUB_OUTPUT"
            echo "Using app/google-services.json from repository"
          elif [ -n "${SECRET_GS_B64}" ]; then
            printf '%s' "${SECRET_GS_B64}" | tr -d '\r\n ' | base64 -d > "${GS_PATH}"
            echo "mode=secret_base64" >> "$GITHUB_OUTPUT"
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret"
          elif [ -n "${SECRET_GS_JSON}" ]; then
            printf '%s\n' "${SECRET_GS_JSON}" > "${GS_PATH}"
            echo "mode=secret_json" >> "$GITHUB_OUTPUT"
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret"
          else
            cat <<'EOF' > "${GS_PATH}"
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "karirku-ci-placeholder",
              "storage_bucket": "karirku-ci-placeholder.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.karirku.vrmxqp"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "placeholder-ci-web-client-id",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "placeholder-ci-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "placeholder-ci-web-client-id",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "mode=placeholder" >> "$GITHUB_OUTPUT"
            echo "::warning::app/google-services.json not found and no GOOGLE_SERVICES_JSON secret configured; using CI placeholder so APK compiles. Add secret GOOGLE_SERVICES_JSON for live Firebase Auth/Firestore."
          fi

      - name: Build Release & Debug APKs
        run: |
          gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Package APKs with versioned names
        id: package
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release-apks

          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_NAME="${VERSION_NAME:-1.0}"
          BUILD_NUM="${GITHUB_RUN_NUMBER}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${INPUT_RELEASE_TAG}" ]; then
            RELEASE_TAG="${INPUT_RELEASE_TAG}"
          else
            RELEASE_TAG="v${VERSION_NAME}-build.${BUILD_NUM}"
          fi

          RELEASE_APK="release-apks/KarirKu-${RELEASE_TAG}-release.apk"
          DEBUG_APK="release-apks/KarirKu-${RELEASE_TAG}-debug.apk"

          cp app/build/outputs/apk/release/app-release.apk "${RELEASE_APK}"
          cp app/build/outputs/apk/debug/app-debug.apk "${DEBUG_APK}"

          ls -lh release-apks/

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_apk=${RELEASE_APK}"
            echo "debug_apk=${DEBUG_APK}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: KarirKu-APK-${{ steps.package.outputs.release_tag }}
          path: |
            ${{ steps.package.outputs.release_apk }}
            ${{ steps.package.outputs.debug_apk }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release with Downloadable APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          name: "KarirKu ${{ steps.package.outputs.release_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## KarirKu Android APK (${{ steps.package.outputs.release_tag }})

            ### File APK Siap Unduh
            - **Debug APK (`KarirKu-${{ steps.package.outputs.release_tag }}-debug.apk`)** — Direkomendasikan untuk langsung diinstal & login Google Sign-In karena sudah menggunakan tanda tangan SHA-1 yang terdaftar di Firebase proyek ini.
            - **Release APK (`KarirKu-${{ steps.package.outputs.release_tag }}-release.apk`)** — Build rilis signed (`keystore mode: ${{ steps.keystore.outputs.mode }}`).

            ### Info Build
            - **Commit:** `${{ github.sha }}`
            - **Run Number:** `#${{ github.run_number }}`
            - **Google Services Config:** `${{ steps.google_services.outputs.mode }}`
            - **Release SHA-1:** `${{ steps.keystore.outputs.release_sha1 }}`

            > **Catatan Firebase (`google-services.json`):** Jika status `Google Services Config` adalah `placeholder`, tambahkan isi file `app/google-services.json` milik proyek Firebase kamu ke **GitHub Repository Settings → Secrets and variables → Actions → New repository secret** dengan nama `GOOGLE_SERVICES_JSON` (atau versi Base64 pada `GOOGLE_SERVICES_JSON_BASE64`) agar Login Google & Firestore aktif penuh pada APK hasil GitHub Actions.
            >
            > **Catatan Google Sign-In pada Release APK:** Jika menggunakan Release APK dengan keystore otomatis, tambahkan `Release SHA-1` di atas ke Firebase Console > Project Settings > Android App, atau simpan keystore permanen pada GitHub Repository Secrets (`KEYSTORE_BASE64`, `STORE_PASSWORD`, `KEY_PASSWORD`).
          files: |
            ${{ steps.package.outputs.release_apk }}
            ${{ steps.package.outputs.debug_apk }}

      - name: Write Build Summary
        run: |
          {
            echo "## KarirKu APK Build Berhasil"
            echo ""
            echo "- **Release Tag:** \`${{ steps.package.outputs.release_tag }}\`"
            echo "- **Keystore Mode:** \`${{ steps.keystore.outputs.mode }}\`"
            echo "- **Google Services Mode:** \`${{ steps.google_services.outputs.mode }}\`"
            echo "- **Release SHA-1:** \`${{ steps.keystore.outputs.release_sha1 }}\`"
            echo "- **Artifacts:** Tersedia di bagian **Artifacts** di bawah dan di halaman **GitHub Releases**."
          } >> "$GITHUB_STEP_SUMMARY"
